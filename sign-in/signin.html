<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Cube Authentication</title>
  <link rel="stylesheet" href="signin.css">
</head>
<body>
<nav class="navbar">
  <div class="logo">MDFD.co</div>
  <ul class="nav-links">
    <li><a href="#">About</a></li>
    <li><a href="#">Contact</a></li>
    <li><a href="#front">Login</a></li>
    <li><a href="#right">Sign Up</a></li>
  </ul>
</nav>

  <div class="scene" id="scene">
    <div class="cube" id="cube">

      <!-- FRONT: Sign In -->
      <div class="face front" id="front">
        <form class="auth-form">
          <h2>Sign In</h2>
          <input type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <button type="submit" class="btn">Sign In</button>
        </form>
      </div>

      <!-- RIGHT: Sign Up -->
      <div class="face right" id="right">
        <form class="auth-form">
          <h2>Sign Up</h2>
          <input type="text" placeholder="Full Name" required>
          <input type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <button type="submit" class="btn">Sign Up</button>
        </form>
      </div>

      <!-- TOP: Google -->
      <div class="face top">
        <button class="btn google">Continue with Google</button>
      </div>

      <!-- BOTTOM: Microsoft -->
      <div class="face bottom">
        <button class="btn microsoft">Continue with Microsoft</button>
      </div>

      <!-- LEFT: Apple -->
      <div class="face left">
        <button class="btn apple">Continue with Apple</button>
      </div>

      <!-- BACK: Optional Forgot Password -->
      <div class="face back">
        <form class="auth-form">
          <h2>Forgot Password</h2>
          <input type="email" placeholder="Enter your email" required>
          <button type="submit" class="btn">Reset Password</button>
        </form>
      </div>

    </div>
  </div>

  <div class="cursor"></div>

  <script src="signin.js"></script>
</body>
</html>
